<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReminderZs UI</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <h1>ReminderZs Blocks</h1>
        <div class="topbar-actions">
          <label class="checkbox"><input type="checkbox" id="debug-python"> Debug Python</label>
          <button id="compile-btn" type="button" class="compile-button">
            <span class="compile-icon">▶</span>
            Compile & Run
          </button>
        </div>
      </header>
      <main class="content">
        <section class="sidebar">
          <div class="library">
            <h2>Blocks</h2>
            <div id="builtin-list" class="palette"></div>
            <h3>Operators</h3>
            <div id="operators-list" class="palette"></div>
            <h3>Discovered from /modules</h3>
            <div id="discovered-list" class="palette"></div>
            <h2>Variables</h2>
            <div id="variables-list" class="vars-list"></div>
            <div class="row">
              <button id="add-var" type="button">Add Variable</button>
              <button id="save-project" type="button">Save</button>
              <button id="load-project" type="button">Load</button>
            </div>
          </div>
        </section>
        <section class="canvas-wrap">
          <div id="canvas" class="canvas" aria-label="Block canvas">
            <div id="canvas-content" class="canvas-content"></div>
          </div>
          <aside class="inspector" id="inspector">
            <h2>Inspector</h2>
            <div id="inspector-content" class="inspector-content">Select a variable to edit</div>
          </aside>
        </section>
      </main>
    </div>

    <!-- Right-click context menu for block search -->
    <div id="context-menu" class="context-menu" style="display: none;">
      <div class="context-menu-header">
        <input type="text" id="block-search" placeholder="Search blocks..." autocomplete="off">
      </div>
      <div id="context-menu-results" class="context-menu-results"></div>
    </div>

    <!-- Floating debug output window -->
    <div id="debug-window" class="debug-window" style="display: none;">
      <div class="debug-window-header">
        <div class="debug-window-title">
          <span class="debug-icon">🐍</span>
          Python Output
        </div>
        <div class="debug-window-controls">
          <button id="debug-window-minimize" class="debug-control-btn" title="Minimize">−</button>
          <button id="debug-window-close" class="debug-control-btn" title="Close">×</button>
        </div>
      </div>
      <div class="debug-window-content">
        <div class="debug-tabs">
          <button class="debug-tab active" data-tab="output">Output</button>
          <button class="debug-tab" data-tab="script">Generated Script</button>
        </div>
        <div class="debug-content">
          <div id="debug-output" class="debug-panel active">
            <pre id="compile-output" class="compile-output" aria-live="polite">Ready to compile...</pre>
          </div>
          <div id="debug-script" class="debug-panel">
            <pre id="generated-script" class="generated-script">No script generated yet.</pre>
          </div>
        </div>
      </div>
    </div>

    <script src="./components/Block.js"></script>
    <script src="./modules/blocks/registry.js"></script>
    <script src="./modules/blocks/factory.js"></script>
    <script src="./renderer.js"></script>
  </body>
  </html>
