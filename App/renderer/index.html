<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>projectLoom UI</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <h1>projectLoom Blocks</h1>
        <div class="topbar-actions">
          <label class="checkbox"><input type="checkbox" id="debug-python"> Debug Python</label>
          <button id="compile-btn" type="button" class="compile-button">
            <span class="compile-icon">▶</span>
            Compile & Run
          </button>
        </div>
      </header>
      <main class="content">
        <section class="sidebar">
          <div class="library">
            <h2>Blocks</h2>
            <div id="builtin-list" class="palette"></div>
            <h3>Operators</h3>
            <div id="operators-list" class="palette"></div>
            <h3>Discovered from /modules</h3>
            <div id="discovered-list" class="palette"></div>
            <h3>Custom Functions</h3>
            <div id="custom-blocks-list" class="palette"></div>
            <button id="add-custom-block" type="button" class="add-custom-btn">+ Create Custom Function</button>
            <h2>Variables</h2>
            <div id="variables-list" class="vars-list"></div>
            <div class="row">
              <button id="add-var" type="button">Add Variable</button>
              <button id="save-project" type="button">Save</button>
              <button id="load-project" type="button">Load</button>
            </div>
          </div>
        </section>
        <section class="canvas-wrap">
          <div id="canvas" class="canvas" aria-label="Block canvas">
            <div id="canvas-content" class="canvas-content"></div>
          </div>
          <aside class="inspector" id="inspector">
            <h2>Inspector</h2>
            <div id="inspector-content" class="inspector-content">Select a variable to edit</div>
          </aside>
        </section>
      </main>
    </div>

    <!-- Right-click context menu for block search -->
    <div id="context-menu" class="context-menu" style="display: none;">
      <div class="context-menu-header">
        <input type="text" id="block-search" placeholder="Search blocks..." autocomplete="off">
      </div>
      <div id="context-menu-results" class="context-menu-results"></div>
    </div>

    <!-- Floating debug output window -->
    <div id="debug-window" class="debug-window" style="display: none;">
      <div class="debug-window-header">
        <div class="debug-window-title">
          <span class="debug-icon">🐍</span>
          Python Output
        </div>
        <div class="debug-window-controls">
          <button id="debug-window-minimize" class="debug-control-btn" title="Minimize">−</button>
          <button id="debug-window-close" class="debug-control-btn" title="Close">×</button>
        </div>
      </div>
      <div class="debug-window-content">
        <div class="debug-tabs">
          <button class="debug-tab active" data-tab="output">Output</button>
          <button class="debug-tab" data-tab="script">Generated Script</button>
        </div>
        <div class="debug-content">
          <div id="debug-output" class="debug-panel active">
            <pre id="compile-output" class="compile-output" aria-live="polite">Ready to compile...</pre>
          </div>
          <div id="debug-script" class="debug-panel">
            <pre id="generated-script" class="generated-script">No script generated yet.</pre>
          </div>
        </div>
      </div>
    </div>

    <!-- Custom Block Creation Modal -->
    <div id="custom-block-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Create Custom Function</h3>
          <button id="custom-block-modal-close" class="modal-close-btn">×</button>
        </div>
        <div class="modal-body">
          <form id="custom-block-form">
            <div class="form-group">
              <label for="custom-block-name">Function Name *</label>
              <input type="text" id="custom-block-name" placeholder="my_function" required>
              <small>Must be a valid Python identifier</small>
            </div>
            
            <div class="form-group">
              <label for="custom-block-description">Description</label>
              <textarea id="custom-block-description" placeholder="What does this function do?" rows="2"></textarea>
            </div>
            
            <div class="form-group">
              <label for="custom-block-instructions">Implementation Instructions</label>
              <textarea id="custom-block-instructions" placeholder="Detailed instructions for how to implement this function..." rows="3"></textarea>
            </div>
            
            <div class="form-section">
              <h4>Inputs</h4>
              <div id="custom-block-inputs" class="param-list"></div>
              <button type="button" id="add-custom-input" class="add-param-btn">+ Add Input</button>
            </div>
            
            <div class="form-section">
              <h4>Outputs</h4>
              <div id="custom-block-outputs" class="param-list"></div>
              <button type="button" id="add-custom-output" class="add-param-btn">+ Add Output</button>
            </div>
            
            <div class="modal-actions">
              <button type="button" id="cancel-custom-block" class="btn-secondary">Cancel</button>
              <button type="submit" class="btn-primary">Create Function</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="./components/Block.js"></script>
    <script src="./components/UIDrawingCanvas.js"></script>
    <script src="./components/UIBlock.js"></script>
    <script src="./modules/blocks/registry.js"></script>
    <script src="./modules/blocks/factory.js"></script>
    <script src="./renderer.js"></script>
  </body>
  </html>
